name: Run Duplicate Demo ID Cleanup

on:
  push:
    paths:
      - '.github/workflows/run-remove-duplicate-demo-id.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python scripts/remove_duplicate_demo_id.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove duplicate Demo ID from member company view"
          git push origin main

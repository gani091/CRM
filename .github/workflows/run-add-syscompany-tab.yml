name: Run SYSADMIN Company Tab Patch

on:
  push:
    paths:
      - '.github/workflows/run-add-syscompany-tab.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python scripts/add_syscompany_tab.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Expose SYSADMIN member company view tab"
          git push origin main
